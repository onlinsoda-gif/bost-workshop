<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f28a13">
<title>گردونه شانس | بست ورکشاپ</title>
<style>
:root{--orange:#f28a13;--navy:#12345b;--muted:#788493;--line:#e3e8ee}
*{box-sizing:border-box}
body{margin:0;background:#f4f6fa;color:var(--navy);font-family:Tahoma,Arial,sans-serif;padding:18px 14px 32px}
main{max-width:720px;margin:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 18px}
.back{display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border:1px solid #ead5bd;border-radius:12px;background:#fff1df;color:#80572f;text-decoration:none;font-weight:700}
.brand{font-size:13px;color:#8a95a3}
h1{text-align:center;font-size:clamp(25px,6vw,34px);margin:18px 0 5px}
.subtitle{text-align:center;color:var(--muted);margin:0 0 20px;line-height:1.8}
.card{background:#fff;border:1px solid #e6ebf0;border-radius:20px;padding:18px;box-shadow:0 3px 12px #193b5b08;margin-bottom:16px}
.wheel-wrap{position:relative;width:min(82vw,360px);aspect-ratio:1;margin:8px auto 18px}
#wheel{display:block;width:100%;height:100%;border-radius:50%;border:7px solid #f5c451;box-shadow:0 7px 22px #172b3a22;transition:transform 5s cubic-bezier(.12,.72,.12,1)}
.pointer{position:absolute;z-index:2;top:-7px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:39px solid #f5c451;filter:drop-shadow(0 2px 2px #777)}
.hub{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);width:60px;height:60px;border-radius:50%;border:5px solid #f5c451;background:white;color:#12345b;display:grid;place-items:center;font-weight:900;box-shadow:0 2px 9px #0003}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:#16a34a;color:#fff;width:100%;font-size:19px}
.secondary{background:#fff5e9;color:#80572f;border:1px solid #ead5bd}
#result{margin-top:15px;padding:15px;text-align:center;border:1px solid #e6ebf0;border-radius:14px;background:#f8fafc;min-height:82px}
#result strong{display:block;font-size:21px;color:#d97706;margin-top:7px;overflow-wrap:anywhere}
h2{font-size:18px;margin:0 0 13px}
#options{display:grid;gap:9px}
.option{display:flex;gap:8px;align-items:center}
.dot{width:13px;height:13px;border-radius:50%;flex:none}
input{min-width:0;width:100%;padding:10px;border:1px solid #d7dfe8;border-radius:9px;background:white;color:#24364b;font:inherit}
.add-row,.actions{display:flex;gap:8px;margin-top:12px}
.add-row button{white-space:nowrap}
.actions button{flex:1}
.hint{font-size:12px;color:var(--muted);line-height:1.8;margin:12px 0 0}
@media(min-width:650px){.card{padding:22px}}
</style>
</head>
<body>
<main>
<div class="top"><a class="back" href="../index.html">→ بازگشت به صفحه اصلی</a><span class="brand">بست ورکشاپ</span></div>
<h1>🎁 گردونه شانس</h1>
<p class="subtitle">گزینه‌ها یا جایزه‌های خود را وارد کنید، سپس گردونه را بچرخانید!</p>
<section class="card">
<div class="wheel-wrap"><div class="pointer"></div><canvas id="wheel" width="900" height="900" aria-label="گردونه شانس"></canvas><div class="hub">شانس</div></div>
<button id="spin" class="primary">🎡 چرخاندن گردونه</button>
<div id="result" aria-live="polite"><span>نتیجه قرعه‌کشی</span><strong id="winner">منتظر شروع هستیم!</strong></div>
</section>
<section class="card">
<h2>⚙️ تنظیم گزینه‌های گردونه</h2>
<div id="options"></div>
<div class="add-row"><input id="newOption" maxlength="28" placeholder="نام جایزه یا گزینه جدید"><button id="add" class="secondary">＋ افزودن</button></div>
<div class="actions"><button id="reset" class="secondary">بازنشانی نمونه</button><button id="clear" class="secondary">حذف همه</button></div>
<p class="hint">هر گزینه شانس مساوی دارد. برای چرخاندن، حداقل دو گزینه لازم است. حداکثر ۱۶ گزینه می‌توان افزود.</p>
</section>
</main>
<script>
(()=>{
const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d');
const colors=['#ef4444','#f59e0b','#22a06b','#3b82f6','#9b59b6','#ec4899','#0d9488','#e87924','#64748b','#ca8a04','#be123c','#0284c7','#65a30d','#9333ea','#db2777','#0f766e'];
const defaults=['جایزه اول','جایزه دوم','جایزه سوم','جایزه چهارم','یک هدیه','شانس دوباره','جایزه ویژه','متأسفانه هیچ'];
let items=[...defaults],rotation=0,busy=false;
const $=id=>document.getElementById(id);
function draw(){
 const n=items.length,w=canvas.width,c=w/2,r=w/2-8;ctx.clearRect(0,0,w,w);
 if(!n){ctx.beginPath();ctx.arc(c,c,r,0,Math.PI*2);ctx.fillStyle='#64748b';ctx.fill();ctx.fillStyle='white';ctx.font='bold 34px Tahoma';ctx.textAlign='center';ctx.fillText('گزینه اضافه کنید',c,c);return}
 const step=Math.PI*2/n;
 for(let i=0;i<n;i++){
  const start=-Math.PI/2+i*step,end=start+step;
  ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,r,start,end);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.stroke();
  ctx.save();ctx.translate(c,c);ctx.rotate(start+step/2);ctx.textAlign='right';ctx.textBaseline='middle';
  const size=Math.min(31,Math.max(18,230/n));ctx.font=`bold ${size}px Tahoma, Arial`;ctx.fillStyle='#fff';ctx.shadowColor='#222';ctx.shadowBlur=4;
  let label=items[i];while(ctx.measureText(label).width>r*.72&&label.length>5)label=label.slice(0,-2)+'…';
  ctx.fillText(label,r-25,0);ctx.restore();
 }
}
function render(){
 $('options').innerHTML='';
 items.forEach((value,i)=>{
  const row=document.createElement('div');row.className='option';
  const dot=document.createElement('span');dot.className='dot';dot.style.background=colors[i%colors.length];
  const input=document.createElement('input');input.value=value;input.maxLength=28;input.setAttribute('aria-label',`گزینه ${i+1}`);
  input.addEventListener('change',()=>{items[i]=input.value.trim()||value;draw()});
  const del=document.createElement('button');del.className='secondary';del.textContent='حذف';del.style.padding='9px 11px';del.disabled=busy;
  del.addEventListener('click',()=>{if(busy)return;items.splice(i,1);render()});
  row.append(dot,input,del);$('options').append(row);
 });
 $('spin').disabled=busy||items.length<2;draw();
}
$('add').addEventListener('click',()=>{if(busy)return;const input=$('newOption'),v=input.value.trim();if(!v)return;if(items.length>=16){$('winner').textContent='حداکثر ۱۶ گزینه مجاز است';return}items.push(v);input.value='';render()});
$('newOption').addEventListener('keydown',e=>{if(e.key==='Enter')$('add').click()});
$('clear').addEventListener('click',()=>{if(busy)return;items=[];$('winner').textContent='گزینه‌ها را اضافه کنید';render()});
$('reset').addEventListener('click',()=>{if(busy)return;items=[...defaults];rotation=0;canvas.style.transition='none';canvas.style.transform='rotate(0deg)';$('winner').textContent='منتظر شروع هستیم!';render()});
$('spin').addEventListener('click',()=>{
 if(busy||items.length<2)return;busy=true;render();$('winner').textContent='🎯 گردونه در حال چرخش است...';
 const n=items.length,step=360/n,index=Math.floor(Math.random()*n),current=((rotation%360)+360)%360;
 const offset=(360-(index*step+step/2)-current+360)%360;rotation+=360*7+offset;
 canvas.style.transition='transform 5s cubic-bezier(.12,.72,.12,1)';canvas.style.transform=`rotate(${rotation}deg)`;
 setTimeout(()=>{$('winner').textContent='🎉 برنده شدی: '+items[index]+'!';busy=false;render()},5100);
});
render();
})();
</script>
</body>
</html>
